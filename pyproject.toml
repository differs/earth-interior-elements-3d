[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-interior-elements-3d"
version = "0.1.0"
description = "大胆假设·仔细推导：地球内部元素/矿产立体分布的可复算分层模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
